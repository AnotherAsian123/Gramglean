services:
  unraiders:
    build: .
    # Or use the prebuilt image instead of building:
    # image: ghcr.io/anotherasian123/unraiders-of-the-lost-sta:latest
    container_name: unraiders
    ports:
      - "8080:8080"
    environment:
      - PUID=99
      - PGID=100
      - UMASK=022
      - TZ=Etc/UTC
      - PORT=8080
      # Parallel download workers (IO-bound; higher = faster but riskier).
      - DOWNLOAD_THREADS=4
      # How many account scrapes may run at once (keep at 1 to avoid bans).
      - MAX_CONCURRENT_JOBS=1
      # Randomized delay (seconds) between Instagram API page requests.
      - RATE_LIMIT_MIN=2.0
      - RATE_LIMIT_MAX=5.0
      - LOG_LEVEL=INFO
      # Encrypt cookie files at rest with AES-256-GCM. Leave unset to store them
      # as plaintext (file-permission protected only). Generate a key with:
      #   python -c "import secrets,base64;print(base64.urlsafe_b64encode(secrets.token_bytes(32)).decode())"
      # - COOKIE_ENCRYPTION_KEY=paste-your-generated-key-here
    volumes:
      - ./data/config:/config
      - ./data/downloads:/downloads
    restart: unless-stopped
